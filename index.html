const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));return new TextDecoder().decode(plain)}
function show(html){document.open();document.write(html);document.close()}
function message(s){document.getElementById('msg').textContent=s}
if(!window.crypto||!crypto.subtle){message('请使用 HTTPS 网址，在 Safari 或 Chrome 中打开。');document.getElementById('enter').disabled=true;}
else {
document.getElementById('gate').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('enter');btn.disabled=true;message('正在验证…');try{const seed=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pwd').value),'PBKDF2',false,['deriveBits']);const raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes(payload.salt),iterations:210000,hash:'SHA-256'},seed,256));const html=await unlock(raw);try{localStorage.setItem(storeKey,btoa(String.fromCharCode(...raw)))}catch(err){alert('浏览器禁止保存访问权限，本次仍可进入；下次可能需要重新输入密码。')}show(html)}catch(err){message('密码不正确，请重新输入。');btn.disabled=false;document.getElementById('pwd').focus()}};
(async()=>{let saved;try{saved=localStorage.getItem(storeKey)}catch(e){}if(saved){try{show(await unlock(bytes(saved)))}catch(e){try{localStorage.removeItem(storeKey)}catch(err){}message('保存的权限已失效，请重新输入密码。')}}})();
